<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confucius SDK Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Confucius SDK Architecture</h1>
      </div>
      <p class="subtitle">Three-layer agent scaffolding framework with AX/UX/DX separation</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 720">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
          </marker>
          <marker id="arrowhead-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
          </marker>
          <marker id="arrowhead-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
          </marker>
          <marker id="arrowhead-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- ===== LAYER 1: Orchestrator (top) ===== -->
        <rect x="50" y="40" width="900" height="180" rx="12" fill="rgba(8, 51, 68, 0.08)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,2"/>
        <text x="62" y="60" fill="#22d3ee" font-size="11" font-weight="600">Layer 1: Orchestrator (AX/UX/DX)</text>

        <!-- Orchestrator core -->
        <rect x="100" y="80" width="200" height="120" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="200" y="105" fill="white" font-size="12" font-weight="600" text-anchor="middle">Orchestrator</text>
        <text x="200" y="122" fill="#94a3b8" font-size="8" text-anchor="middle">Reason-Act Loop</text>
        <text x="200" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">Algorithm 1</text>
        <text x="200" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">LLM Invocation</text>
        <text x="200" y="176" fill="#94a3b8" font-size="8" text-anchor="middle">Action Parsing</text>

        <!-- Agent Experience (AX) -->
        <rect x="380" y="80" width="200" height="120" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="480" y="105" fill="white" font-size="12" font-weight="600" text-anchor="middle">Agent Experience (AX)</text>
        <text x="480" y="122" fill="#94a3b8" font-size="8" text-anchor="middle">Compressed Inputs</text>
        <text x="480" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">Structured Summaries</text>
        <text x="480" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">Action<file_edit></text>
        <text x="480" y="176" fill="#94a3b8" font-size="8" text-anchor="middle">Execution Results</text>

        <!-- User Experience (UX) -->
        <rect x="660" y="80" width="200" height="120" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="760" y="105" fill="white" font-size="12" font-weight="600" text-anchor="middle">User Experience (UX)</text>
        <text x="760" y="122" fill="#94a3b8" font-size="8" text-anchor="middle">Rich Diff Display</text>
        <text x="760" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">Streaming Updates</text>
        <text x="760" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">Execution Trace</text>
        <text x="760" y="176" fill="#94a3b8" font-size="8" text-anchor="middle">Error Highlights</text>

        <!-- AX arrows -->
        <line x1="300" y1="140" x2="378" y2="140" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead-emerald)"/>
        <line x1="580" y1="140" x2="658" y2="140" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="340" y="130" fill="#94a3b8" font-size="7">Parse</text>
        <text x="620" y="130" fill="#94a3b8" font-size="7">Separate streams</text>

        <!-- ===== LAYER 2: Memory System (middle) ===== -->
        <rect x="50" y="260" width="900" height="180" rx="12" fill="rgba(76, 29, 149, 0.08)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,2"/>
        <text x="62" y="280" fill="#a78bfa" font-size="11" font-weight="600">Layer 2: Memory System</text>

        <!-- Context Window -->
        <rect x="100" y="300" width="200" height="110" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="200" y="322" fill="white" font-size="11" font-weight="600" text-anchor="middle">Context Window</text>
        <text x="200" y="340" fill="#94a3b8" font-size="8" text-anchor="middle">System Prompt + Summary</text>
        <text x="200" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">+ Recent N Turns</text>
        <text x="200" y="374" fill="#94a3b8" font-size="8" text-anchor="middle">↓ Compression Trigger</text>
        <text x="200" y="392" fill="#22d3ee" font-size="7" text-anchor="middle">when > 80% capacity</text>

        <!-- Architect Agent -->
        <rect x="380" y="300" width="200" height="110" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="480" y="322" fill="white" font-size="11" font-weight="600" text-anchor="middle">Architect Agent</text>
        <text x="480" y="340" fill="#94a3b8" font-size="8" text-anchor="middle">Structured Summarization</text>
        <text x="480" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">- Task Goals</text>
        <text x="480" y="372" fill="#94a3b8" font-size="8" text-anchor="middle">- Decisions Made</text>
        <text x="480" y="388" fill="#94a3b8" font-size="8" text-anchor="middle">- Open TODOs</text>

        <!-- Hierarchical Memory -->
        <rect x="660" y="300" width="200" height="110" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="760" y="322" fill="white" font-size="11" font-weight="600" text-anchor="middle">Hierarchical Memory</text>
        <text x="760" y="340" fill="#94a3b8" font-size="8" text-anchor="middle">analysis.md</text>
        <text x="760" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">implementation_summary.md</text>
        <text x="760" y="372" fill="#94a3b8" font-size="8" text-anchor="middle">todo.md</text>
        <text x="760" y="392" fill="#a78bfa" font-size="7" text-anchor="middle">Persistent file system</text>

        <!-- Memory arrows -->
        <line x1="300" y1="355" x2="378" y2="355" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead-violet)"/>
        <line x1="580" y1="355" x2="658" y2="355" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="340" y="345" fill="#94a3b8" font-size="7">Trigger</text>
        <text x="610" y="345" fill="#94a3b8" font-size="7">Store</text>

        <!-- ===== LAYER 3: Extensions (bottom) ===== -->
        <rect x="50" y="480" width="900" height="200" rx="12" fill="rgba(6, 78, 59, 0.08)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,2"/>
        <text x="62" y="500" fill="#34d399" font-size="11" font-weight="600">Layer 3: Extensions (Modular Tool System)</text>

        <!-- Perception -->
        <rect x="100" y="520" width="180" height="130" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="190" y="542" fill="white" font-size="11" font-weight="600" text-anchor="middle">Perception Ext.</text>
        <text x="190" y="560" fill="#94a3b8" font-size="8" text-anchor="middle">on_llm_output</text>
        <text x="190" y="576" fill="#94a3b8" font-size="8" text-anchor="middle">Parse XML tags</text>
        <text x="190" y="592" fill="#94a3b8" font-size="8" text-anchor="middle">Extract actions</text>
        <text x="190" y="608" fill="#94a3b8" font-size="8" text-anchor="middle">Validate structure</text>
        <text x="190" y="628" fill="#34d399" font-size="7" text-anchor="middle">Callback: on_llm_output</text>

        <!-- Reasoning -->
        <rect x="350" y="520" width="180" height="130" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="440" y="542" fill="white" font-size="11" font-weight="600" text-anchor="middle">Reasoning Ext.</text>
        <text x="440" y="560" fill="#94a3b8" font-size="8" text-anchor="middle">on_input_messages</text>
        <text x="440" y="576" fill="#94a3b8" font-size="8" text-anchor="middle">Rewrite prompts</text>
        <text x="440" y="592" fill="#94a3b8" font-size="8" text-anchor="middle">Inject context</text>
        <text x="440" y="608" fill="#94a3b8" font-size="8" text-anchor="middle">Filter messages</text>
        <text x="440" y="628" fill="#34d399" font-size="7" text-anchor="middle">Callback: on_input</text>

        <!-- Action -->
        <rect x="600" y="520" width="180" height="130" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="690" y="542" fill="white" font-size="11" font-weight="600" text-anchor="middle">Action Ext.</text>
        <text x="690" y="560" fill="#94a3b8" font-size="8" text-anchor="middle">Execute tools</text>
        <text x="690" y="576" fill="#94a3b8" font-size="8" text-anchor="middle">- Shell commands</text>
        <text x="690" y="592" fill="#94a3b8" font-size="8" text-anchor="middle">- File edits</text>
        <text x="690" y="608" fill="#94a3b8" font-size="8" text-anchor="middle">- Tests</text>
        <text x="690" y="628" fill="#34d399" font-size="7" text-anchor="middle">Callback: on_action</text>

        <!-- ===== CROSS-LAYER CONNECTIONS ===== -->
        <!-- Orchestrator → Memory -->
        <path d="M 200 200 L 200 240 Q 200 250 200 260 L 200 298" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-violet)"/>
        <text x="215" y="250" fill="#a78bfa" font-size="8">Store results</text>

        <!-- Memory → Orchestrator -->
        <path d="M 480 410 L 480 440 Q 480 450 350 450 L 200 450 Q 190 450 190 440 L 190 202" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead-violet)"/>
        <text x="340" y="445" fill="#a78bfa" font-size="7">Inject summary</text>

        <!-- Orchestrator → Extensions -->
        <path d="M 150 200 L 150 240 Q 150 250 150 320 L 150 518" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-emerald)"/>
        <text x="160" y="360" fill="#34d399" font-size="8" transform="rotate(90,160,360)">Route actions</text>

        <!-- ===== META-AGENT (top right) ===== -->
        <rect x="800" y="540" width="120" height="110" rx="8" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="860" y="562" fill="white" font-size="10" font-weight="600" text-anchor="middle">Meta-Agent</text>
        <text x="860" y="580" fill="#94a3b8" font-size="7" text-anchor="middle">Build-Test-Improve</text>
        <text x="860" y="596" fill="#94a3b8" font-size="7" text-anchor="middle">Auto-refine</text>
        <text x="860" y="612" fill="#94a3b8" font-size="7" text-anchor="middle">config + prompt</text>
        <text x="860" y="628" fill="#94a3b8" font-size="7" text-anchor="middle">+ tool wiring</text>

        <!-- Meta-Agent connection -->
        <line x1="800" y1="595" x2="780" y2="585" stroke="#fb923c" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="810" y="648" fill="#fb923c" font-size="7">DX layer</text>

        <!-- ===== LEGEND ===== -->
        <rect x="50" y="700" width="800" height="12" fill="transparent"/>
        <rect x="50" y="700" width="12" height="8" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="66" y="706" fill="#94a3b8" font-size="7">Orchestrator</text>
        <rect x="130" y="700" width="12" height="8" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="146" y="706" fill="#94a3b8" font-size="7">Memory</text>
        <rect x="192" y="700" width="12" height="8" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="208" y="706" fill="#94a3b8" font-size="7">Extensions</text>
        <rect x="266" y="700" width="12" height="8" rx="2" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1"/>
        <text x="282" y="706" fill="#94a3b8" font-size="7">Meta-Agent</text>
        <rect x="340" y="700" width="12" height="8" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
        <text x="356" y="706" fill="#94a3b8" font-size="7">Architect Agent</text>

        <!-- DX annotation -->
        <rect x="470" y="700" width="12" height="8" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="486" y="706" fill="#94a3b8" font-size="7">User Experience</text>
      </svg>
    </div>

    <p class="footer">Confucius SDK • Meta • Harvard • 2025-2026</p>
  </div>
</body>
</html>
