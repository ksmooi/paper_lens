# ============================================================
# 核心知識點(建議 3~6 點)
# ============================================================
knowledge_points:
  - "Compound AI System 架構——不是單一 LLM，而是多個 agent、workflow、tool 的結構化組合"
  - "Scaffolding vs. Harness——agent 建造階段（system prompt、tool schemas 靜態組裝）與執行階段（tool dispatch、context management 動態調度）的明確分工"
  - "Extended ReAct Execution Loop——Staged Compaction → Thinking → Self-Critique → Action → Tool Dispatch → Post-Processing 六階段"
  - "Adaptive Context Compaction（五階段漸進壓縮）——70% warning → 80% observation masking → 85% fast pruning → 90% aggressive masking → 99% full LLM summarization"
  - "Defense-in-Depth Safety Architecture——Prompt-Level → Schema-Level → Runtime Approval → Tool-Level → Lifecycle Hooks 五層安全架構"
  - "從 HyperAgent 到 OPENDEV 的設計演進——從 benchmark-oriented centralized multi-agent 到 interactive terminal-native compound system"


