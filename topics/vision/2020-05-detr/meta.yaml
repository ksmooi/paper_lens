knowledge_points:
  - "集合預測 (Set Prediction) 框架:將偵測視為直接輸出物體集合,消除 NMS、anchor、proposal"
  - "Transformer Encoder-Decoder 架構:CNN backbone + transformer encoder(全局 self-attention)+ decoder(cross-attention + object queries)"
  - "Object Queries:N=100 個可學習位置編碼,每個 query 專注於特定區域與尺寸"
  - "Bipartite Matching Loss(匈牙利匹配):預測集與真實集之間找最佳一對一匹配,消除重複預測"
  - "Hungarian Loss:匹配後對每對計算 class CE + ℓ1 + GIoU 損失"
  - "全景分割擴展:在 decoder 輸出加上 mask head,用 pixel-wise argmax 統一做 thing/stuff 預測"


